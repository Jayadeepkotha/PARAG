[gemini_models]
# Priority list of models to use in order (fastest high-quota models first)
model_1 = gemini-3.5-flash
model_2 = gemini-3.5-flash-lite
model_3 = gemini-3.1-flash-lite
model_4 = gemini-3.8-flash

[settings]
# Temperature for RAG QA generation
temperature = 0.0
# Max retries per model before switching
max_retries_per_model = 1
# Timeout in seconds
timeout = 15
